model_kind: hf
dtype: bf16
cache_mode: topk
top_k_teacher: 256
top_k_student: 256
ref_topk: 256
offload_to_cpu: false
teacher_rl_path: /root/autodl-tmp/models/JustRL-DeepSeek-1.5B
teacher_ref_path: /root/autodl-tmp/models/DeepSeek-R1-Distill-Qwen-1.5B
dataset:
  type: jsonl
  path: /root/autodl-tmp/data/gsm8k.jsonl
  max_prompt_len: 256
  max_response_len: 384
  tokenizer_path: /root/autodl-tmp/models/DeepSeek-R1-Distill-Qwen-7B
stage1:
  warmup_M: 0
  warmup_source: none
  build_batch_size: 4
  load_cache: false
  cache_path: /root/autodl-tmp/cache_7b.pt
stage2:
  distributed: false
  tp_size: 1
  rollout_engine: toy
  renormalize_topk_support: true
  delta_clip: 2.0
  lr: 3.0e-05
  kl_reg_coef: 0.5
  clip_eps: 0.2
  staleness_threshold: 4
  queue_size: 8
  n_steps: 200
  batch_size: 2
  optimizer: adamw_8bit
run:
  checkpoint_every: 40
  run_dir: /root/autodl-tmp/runs/ms_7b
student_path: /root/autodl-tmp/models/DeepSeek-R1-Distill-Qwen-7B
eval:
  model_path: /root/autodl-tmp/models/DeepSeek-R1-Distill-Qwen-7B
