# 多学生并发 · 本地冒烟配置（toy 内核 + CPU，验证编排逻辑，非真实训练）
# 用法：SMOKE=1 bash run_all.sh smoke —— 并发 3 学生（缓存并行建 + 训练并行跑 + run 目录产出）。

model_kind: toy              # toy 内核（CPU 可跑）

stage0:
  n_rl_steps: 3

stage1:
  load_cache: false          # 训练阶段脚本置 true
  warmup_M: 2
  warmup_source: student_init
  warmup_temperature: 1.0

stage2:
  distributed: false
  tp_size: 1
  renormalize_topk_support: false   # smoke 走 dense（无 topk），归一不适用
  staleness_threshold: 4
  queue_size: 4
  kl_reg_coef: 0.05
  clip_eps: 0.2
  lr: 1.0e-3
  n_steps: 5                 # 冒烟步数（脚本不覆盖）
  batch_size: 4

run:
  checkpoint_every: 2
